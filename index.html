<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Переход в Telegram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            color: #ffffff;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 90%;
        }

        .btn {
            display: inline-block;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #0088cc, #00a8ff);
            border: none;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(0, 136, 204, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 5px 15px rgba(0, 136, 204, 0.3);
        }

        /* Предупреждение для TikTok WebView */
        .tiktok-warning {
            display: none;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .tiktok-warning p {
            font-size: 15px;
            line-height: 1.4;
            color: #f1f1f1;
        }

        .arrow-icon {
            font-size: 24px;
            display: block;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Блок, который покажется только внутри TikTok -->
        <div id="tiktokAlert" class="tiktok-warning">
            <span class="arrow-icon">👆</span>
            <p>Чтобы кнопка работала корректно, откройте страницу в браузере (нажмите на три точки или значок компаса/браузера вверху экрана).</p>
        </div>

        <a href="https://t.me/durov" id="actionBtn" class="btn" target="_blank" rel="noopener noreferrer">Получить</a>
    </div>

    <script>
        // Проверяем, открыт ли сайт во встроенном браузере TikTok
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        const isTikTok = /Musicalally|TikTok/i.test(ua);

        if (isTikTok) {
            document.getElementById('tiktokAlert').style.display = 'block';
        }
    </script>

</body>
</html>
